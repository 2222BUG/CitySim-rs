# CitySim-rs workspace（Stage 0 Step 9 建立）
# 成员=spikes/*（Spike 验证件）与 crates/*（支撑 crate）；
# 权威/非权威 crate 分类随 2.2 目录结构定案（decision-log 债务 #15）后另行划分。
[workspace]
resolver = "2"
members = [
    "spikes/simscalar-spike",
    "spikes/rng-spike",
    "spikes/network-tx-spike",
    "spikes/save-restore-spike",
    "crates/sim-test-support",
    "crates/dep-verify",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
